# Every non-merge commit in a pull request must carry a Signed-off-by line.
# See DCO and CONTRIBUTING.md. Bot-authored commits are exempt.
name: 📜 CI | DCO

on:
  pull_request:

concurrency:
  group: dco-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author=$(git log -1 --format='%an' "$sha")
            case "$author" in *"[bot]") continue ;; esac
            if ! git log -1 --format='%B' "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by line"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Add a sign-off with: git commit --amend -s (or git rebase --signoff $BASE_SHA)"
            exit 1
          fi
