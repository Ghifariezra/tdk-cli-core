# GitHub's CodeQL code scanning (free for public repos). Findings appear under Security > Code scanning.
name: 🔬 Security | CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, so new queries catch old code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep each PR head SHA's CodeQL run: Scorecard evaluates SAST coverage per
  # merged PR commit, so cancelling an older run can leave that SHA unscanned.
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  # Pull requests only. The javascript-typescript leg runs on every pull request, so Scorecard's SAST check sees each
  # merged change as scanned (#835). The actions leg runs only when a workflow file changes.
  changes:
    name: 🔎 Detect Workflow Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 2 # every job finishes in under 20s; fail fast if one hangs
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of a pull request
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'

  analyze:
    name: 🔬 Analyze (${{ matrix.language }})
    needs: changes
    # `changes` is skipped on push and schedule, so `!cancelled()` keeps this job from inheriting that skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The actions leg is a step-level gate: a matrix leg cannot take its own job-level `if`, so on a pull request
      # without workflow changes it reports success with these two steps skipped. Anything but 'false' runs it.
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: ${{ matrix.language != 'actions' || github.event_name != 'pull_request' || needs.changes.outputs.workflows != 'false' }}
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: ${{ matrix.language != 'actions' || github.event_name != 'pull_request' || needs.changes.outputs.workflows != 'false' }}
        with:
          category: /language:${{ matrix.language }}

  # Starlark (Tiltfiles, *.star) has no CodeQL extractor. This unofficial community analyzer reports through SARIF into the
  # same Code scanning view. Pinned to a full commit like every other action here.
  starlark:
    name: 🔬 Analyze (starlark)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: flisk-sh/codeql-starlark@6b3ac9d69c3bfd11ebe05fbd87bf9f9dd731c687 # main
