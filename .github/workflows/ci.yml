# Checks for every PR and push to main. Run manually from the Actions tab too.
name: ✅ CI | Checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly coverage badge refresh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only change-detection job in this run. Every other job reads its outputs.
  changes:
    name: 🔎 Detect Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 2 # every job finishes in under 20s; fail fast if one hangs
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of a pull request
    outputs:
      # 'true' only when every changed file is documentation. Decided on pull requests; push and dispatch runs never
      # report 'true', so they run every job.
      docs_only: ${{ steps.docs.outputs.code == 'false' }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      workflows: ${{ steps.filter.outputs.workflows }}
      # The matrix axis values the CLI's registries declare (tests/e2e/lib/registry-axes.mjs), as JSON. A matrix built from it
      # cannot drift from the code.
      axes: ${{ steps.axes.outputs.axes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `code` is true when any changed file is outside the docs patterns. Same patterns as the docs-only check it replaces.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: docs
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!openspec/**'
              - '!LICENSE'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            lockfile:
              - 'bun.lock'
              - 'package.json'
              - 'cli/package.json'
            workflows:
              - '.github/workflows/**'

      - name: Read the matrix axes from the registries
        id: axes
        run: echo "axes=$(node tests/e2e/lib/registry-axes.mjs)" >> "$GITHUB_OUTPUT"

  spellcheck:
    name: 🔤 Spell check
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  lint:
    name: 🛡️ Lint
    runs-on: ubuntu-26.04
    needs: changes
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    permissions:
      contents: write # push Biome fixes and a rebuilt cli/dist back to the PR branch
      actions: write # start CI on the pushed fix commit
    defaults:
      run:
        working-directory: cli
    env:
      # Only same-repo PRs can be pushed to; forks get a read-only token.
      AUTOFIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A same-repo PR checks out its own branch (not the merge commit), so fixes can be pushed to it.
          # A fork's branch does not exist in this repository, so fork PRs use the default PR merge ref.
          ref: ${{ (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref) || github.ref }}
          persist-credentials: true # zizmor: ignore[artipacked] needed to push the autofix commit
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - run: bun install --frozen-lockfile
      # Applies Biome's safe fixes and rebuilds cli/dist, then commits both.
      # A push made with GITHUB_TOKEN doesn't start CI by itself, so the step
      # dispatches a CI run on the branch to check the fix commit.
      - name: Autofix lint and cli/dist
        if: env.AUTOFIX == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          bun run lint:fix || true
          bun run build
          git add -A .
          git add -f dist
          if git diff --cached --quiet; then
            echo "Nothing to fix."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply Biome fixes and rebuild cli/dist"
            git push
            gh workflow run ci.yml --ref "$BRANCH"
            echo "::notice::Pushed a commit with Biome fixes and a rebuilt cli/dist; started CI on it."
          fi
      - run: bun run lint
      # Fails when a test file re-declares a shared helper instead of importing it from test-support (#1402).
      - name: Check test helpers are not duplicated
        run: node ../scripts/check-test-helper-allowlist.mjs

  typecheck:
    name: 🦴 Typecheck
    runs-on: ubuntu-26.04
    needs: changes
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - run: bun install --frozen-lockfile
      # tsc prints file(line,col) errors; rewrite them as ::error workflow commands so GitHub annotates the PR diff.
      - name: Typecheck
        run: |
          set -o pipefail
          bunx tsc --project tsconfig.typecheck.json --pretty false | sed -E 's#^([^(]+)\(([0-9]+),([0-9]+)\): error (.*)$#::error file=cli/\1,line=\2,col=\3::\4#'

  fuzz:
    name: 🧬 Fuzz
    runs-on: ubuntu-26.04
    needs: changes
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 3
    defaults:
      run:
        working-directory: tests/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - run: bun install --frozen-lockfile
      - run: bun run fuzz

  published-schema:
    name: 📜 Published service schema
    runs-on: ubuntu-26.04
    needs: changes
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate the service schema (offline, no live fetch)
        run: node scripts/check-published-service-schema.mjs

  test:
    name: 🧪 Test
    runs-on: ubuntu-26.04
    needs: changes
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    # A hang guard, not a speed target: the suite (with every Starlark test that spawns tilt) takes 23 to 89 seconds, and a one-minute
    # limit cancelled it in 3 of 19 recent runs with no failing step.
    timeout-minutes: 10
    permissions:
      contents: write # push the refreshed coverage badge branch
      pull-requests: write # open the coverage badge PR
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true # needed to push the coverage badge branch
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - name: Install Tilt for Starlark generator tests
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Free host Postgres port before project integration tests
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit
      # One Vitest run does both jobs: the test verdict and the report-only coverage output (text, HTML and JSON-summary reports
      # in cli/coverage/, no threshold). It writes the JSON report with the failed test names for the PR summary (#1385) even
      # when a test fails. Running the suite a second time for coverage doubled the slowest CI job.
      - name: Run TypeScript unit tests with coverage
        working-directory: cli
        run: bun run test:coverage
        env:
          TDK_REQUIRE_TILT: '1'
      - name: Check shell verification script syntax
        working-directory: .
        run: make test-shell
      # Fails when a high-risk area drops below its baseline in cli/coverage-baseline.json (the ratchet).
      - name: Coverage ratchet for high-risk areas
        if: ${{ !cancelled() }}
        run: node scripts/coverage-ratchet.mjs --json test-results/coverage-ratchet.json
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const { total } = require("./coverage/coverage-summary.json");
            const rows = ["lines", "statements", "functions", "branches"].map(
              (k) => "| " + k + " | " + total[k].pct + "% | " + total[k].covered + "/" + total[k].total + " |",
            );
            console.log(["## Unit test coverage", "", "| Metric | Coverage | Covered |", "|---|---|---|", ...rows, ""].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-coverage-html
          path: cli/coverage/
          retention-days: 14
          if-no-files-found: warn
      # The inputs of the PR summary (#1385): Vitest's JSON reporter output, the coverage summary and the ratchet's JSON report.
      - name: Collect the unit test results for the PR summary
        if: always()
        run: |
          mkdir -p test-results
          cp -f coverage/coverage-summary.json coverage/coverage-final.json test-results/ || true
      - name: Upload the unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-results
          path: cli/test-results/
          retention-days: 14
          if-no-files-found: warn
      # main is behind a merge queue, so CI cannot push directly to it (GH013); refresh the badge via a PR instead.
      - name: Regenerate coverage badge
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        working-directory: .
        run: node scripts/coverage-badge.mjs
      - name: Open PR with refreshed coverage badge
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet docs/assets/coverage.svg; then
            echo "Coverage badge unchanged; no PR needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/refresh-coverage-badge"
          git checkout -b "$BRANCH"
          git add docs/assets/coverage.svg
          git commit -m "chore: refresh coverage badge"
          git push --force-with-lease origin "$BRANCH"
          if [ "$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head "$BRANCH" --title "chore: refresh coverage badge" --body "Auto-generated by CI from the latest main coverage run."
          else
            echo "PR already open for $BRANCH; pushed an update."
          fi

  # Writes the test summary to the job summary and creates or edits the one PR comment with it (#1385). Reads only the JSON the
  # Test job uploads. A fork's token is read-only, so a fork PR gets the job summary and no comment.
  pr-summary:
    name: 📝 PR test summary
    runs-on: ubuntu-26.04
    needs: [changes, test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read # lists the E2E workflow runs of the pull request's head commit
      pull-requests: write # creates or edits the summary comment
    steps:
      # Full history, so the base commit of the pull request is present for the changed-line coverage diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the unit test results
        id: unit
        continue-on-error: true # the Test job may have stopped before its report step; the summary says so
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unit-test-results
          path: unit-results

      - name: Write the test summary and the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--unit unit-results --test-result "$TEST_RESULT" --run-url "$RUN_URL" --repo "$REPO" --sha "$HEAD_SHA" --diff-base "$BASE_SHA")
          if [ "$SAME_REPO" = "true" ]; then args+=(--pr "$PR_NUMBER" --post); fi
          node scripts/test-summary.mjs "${args[@]}" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

  # test-python remains a local target until the clean-checkout failures in #700 are resolved.

  # Builds and packs the CLI once per run. package-smoke installs this tarball instead of packing its own.
  package:
    name: 📦 Pack CLI
    runs-on: ubuntu-26.04
    needs: changes
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Build
        run: |
          bun install --frozen-lockfile
          npm run build

      # cli/dist is committed so `npm install -g github:flisk-sh/flisk`
      # works without a build step. Fail if a source change was committed
      # without rebuilding it.
      # Locally: `npm run check:dist` in cli/ does both steps.
      - name: Check committed cli/dist is up to date
        run: scripts/check-cli-dist.sh

      - name: Pack the CLI tarball
        run: | # zizmor: ignore[adhoc-packages] packs our own checkout
          mkdir -p "$RUNNER_TEMP/cli-tarball"
          npm pack --pack-destination "$RUNNER_TEMP/cli-tarball"

      - name: Upload the CLI tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/cli-tarball/*.tgz
          retention-days: 1
          if-no-files-found: error

  # Installs the npm package the way users do (npm install -g) and runs it,
  # so a release can't ship without the compiled CLI or its dependencies.
  package-smoke:
    name: 📦 Package Smoke Test
    runs-on: ubuntu-26.04
    needs: [changes, package]
    # Skip on docs-only PRs; a skipped job still satisfies required checks. When package failed, this job still runs
    # and the download below fails it, instead of skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 3 # install Tilt and free the host Postgres port before the package smoke test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The installed CLI's cold start needs Bun on PATH (the check fails without it).
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Download the packed CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/cli-tarball

      - name: Install globally
        uses: ./.github/actions/install-flisk # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          tarball: ${{ runner.temp }}/cli-tarball/flisk-*.tgz

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Free port 5432 (runner's preinstalled Postgres)
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Run the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          flisk --version
          mkdir smoke-project && cd smoke-project
          flisk project --yes
          printf 'y\n' | flisk resource orders-api --type backend --stack shop
          test -f services/shop/orders-api/service.json
          echo "✅ Installed package scaffolds a project and a resource"

  secret-scan:
    name: 🔑 Secret Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  # Needs "Dependency graph" turned on in Settings > Code security, then the
  # repository variable DEPENDENCY_REVIEW set to true (Settings > Variables).
  dependency-review:
    name: 🔒 Dependency Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    needs: changes
    if: vars.DEPENDENCY_REVIEW == 'true' && needs.changes.outputs.lockfile == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  workflow-audit:
    name: 🛠️ Workflow Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          fail-on-error: true
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows/
          advanced-security: false
          annotations: true

  pr-summary-review:
    name: 🧐 PR summary review
    # Also runs on merge queue entries: the queue is where the required check must still mean something. The merge queue reads the
    # pull request named by its ref, so it checks the same description the pull request was checked with.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check summary and verification notes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/check-pr-review-readiness.mjs

  # Aggregate gate. The e2e group gates live in their own workflows, so `needs:` cannot name them: this job reads their check runs
  # on the head commit instead and fails when one is missing or failed. GitHub's check-runs endpoint includes skipped jobs, while
  # the check-suites endpoint does not; query runs rather than suites. A skipped gate passes, as a skipped job does here.
  summary:
    name: 📋 Summary
    runs-on: ubuntu-26.04
    # Waits for the e2e gates, which run for tens of minutes on a pull request. The wait is bounded by the deadline in the
    # script below.
    timeout-minutes: 35
    if: always()
    needs: [lint, spellcheck, typecheck, test, package, package-smoke, secret-scan, dependency-review, workflow-audit]
    permissions:
      contents: read
      checks: read # reads the e2e gates' check runs on the head commit
      actions: read # reads the gate workflows' runs for the head commit
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The gate list and the wait live in scripts/, so the workflow and the scripts cannot drift apart (#1816).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Render summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(
              if .value.result == "success" then "✅ Passed"
              elif .value.result == "skipped" then "⏭️ Skipped"
              elif .value.result == "cancelled" then "🚫 Cancelled"
              else "❌ Failed" end) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          # The table alone passes the job, so a failed or cancelled job above would not fail the required check.
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success" and .result != "skipped")' >/dev/null; then
            echo "::error::A job above did not pass. See the CI Summary table."
            exit 1
          fi

      # Waits for the gates that report for this event. Every gate waited for reports on every pull request (a gate whose paths
      # did not change passes at once), so a missing name fails the summary. A push to main runs the journeys gate only, and a
      # manual dispatch of ci.yml starts no gate workflow, so those runs wait for nothing instead of burning the deadline on a
      # gate that can never report (#1816).
      - name: Check the e2e group gates
        run: node scripts/wait-for-e2e-gates.mjs --event "$GITHUB_EVENT_NAME" --sha "$HEAD_SHA" --repo "$REPO"
