# Report-only code health: unused code (Knip) and React/Ink hygiene (React Doctor). Results land in the job
# summary; neither tool fails the build, so existing findings do not block PRs.
name: 🩺 CI | Code health

on:
  schedule:
    - cron: "0 9 * * 1" # weekly report; pull requests no longer run it
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: 🩺 Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Knip (unused files, exports, dependencies)
        run: |
          {
            echo '### Knip'
            echo '```'
            npx --no-install knip || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: React Doctor (score 0-100)
        run: |
          {
            echo '### React Doctor'
            echo "Score: $(npx -y react-doctor@0.9.17 --score --no-supply-chain --yes . 2>/dev/null | tail -1)/100"
          } >> "$GITHUB_STEP_SUMMARY"
