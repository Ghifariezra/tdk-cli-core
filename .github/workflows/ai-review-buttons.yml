# Appends AI review links (Grok, Claude, Codex) to pull request bodies.
# Markdown shields only: no API call, no review comment.
# pull_request_target is allowed only because checkout is the default branch
# and the only write is the PR body. Do not checkout the PR head and do not
# run PR code in this job.
#
# New PRs get buttons on opened/reopened/edited. Merging does not rerun those
# events on already-open PRs. Run workflow_dispatch once after merge to
# backfill open PRs (forks and empty bodies included). Closed PRs do not need
# a backfill; the next reopen runs the normal trigger. No synchronize.
name: 🔍 Automation | AI review buttons

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] never checks out or runs PR code; only writes the PR body
    types: [opened, reopened]
  workflow_dispatch:

permissions: {}

# Serialize writes per PR: two `edited` events cannot PATCH in parallel.
# Backfill is a separate group so a manual run cannot block event runs.
concurrency:
  group: ai-review-buttons-${{ github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  append:
    name: Append AI review buttons
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    # No same-repo if. Forks are covered because this event runs the workflow
    # from the base branch. Do not checkout the PR head and do not run PR code.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Run the same scripts/ai-review-buttons.mjs contributors test locally
      # (single implementation). Default branch only — never the PR head.
      # persist-credentials: false keeps the job from leaving a write-capable
      # git credential on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Event fields go through env, never into the script string (template-injection safe).
      # Body is fetched with gh so large/multiline bodies are not interpolated into the workflow.
      - name: Append AI review buttons
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OUT_FILE: ${{ runner.temp }}/pr-body-new.md
          PATCH_FILE: ${{ runner.temp }}/pr-body-patch.json
        run: |
          set -euo pipefail
          test -f scripts/ai-review-buttons.mjs

          # Snapshot the live body (not the event payload).
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '(.body // "") | @base64' > "${OUT_FILE}.b64"
          base64 -d < "${OUT_FILE}.b64" > "${OUT_FILE}.in"

          # Single implementation: append when marker missing; regenerate tail when
          # URL drift; skip when the generated prompt already matches.
          export BODY_FILE="${OUT_FILE}.in"
          node scripts/ai-review-buttons.mjs

          if cmp -s "${OUT_FILE}.in" "$OUT_FILE"; then
            echo "Body unchanged; nothing to PATCH."
            exit 0
          fi

          # Lost-update guard: re-read immediately before PATCH. If the author
          # (or another actor) changed the body since the snapshot, skip rather
          # than overwrite their edit.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '(.body // "") | @base64' > "${OUT_FILE}.now.b64"
          base64 -d < "${OUT_FILE}.now.b64" > "${OUT_FILE}.now"
          if ! cmp -s "${OUT_FILE}.in" "${OUT_FILE}.now"; then
            echo "Body changed since snapshot; skipping PATCH to avoid a lost update."
            exit 0
          fi

          jq -n --rawfile body "$OUT_FILE" '{body: $body}' > "$PATCH_FILE"
          jq -e 'has("body") and (.body | type == "string")' "$PATCH_FILE" > /dev/null
          # Pipe JSON to stdin; --input <file> is unreliable across gh versions for large bodies.
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --input - < "$PATCH_FILE"

  backfill:
    name: Backfill open PRs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # 100 open PRs at a few seconds each; stay under a hard cap.
    timeout-minutes: 15
    # Same rules as append: checkout main only, never a PR head, only write the body.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Backfill open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f scripts/ai-review-buttons.mjs

          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title,url \
            --jq '.[] | [.number, .title, .url] | @tsv' |
          while IFS=$'\t' read -r number title url; do
            export PR_NUMBER="$number" PR_TITLE="$title" PR_URL="$url"
            export BODY_FILE="${RUNNER_TEMP}/in-${number}.md"
            export OUT_FILE="${RUNNER_TEMP}/out-${number}.md"
            export PATCH_FILE="${RUNNER_TEMP}/patch-${number}.json"

            gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq '(.body // "") | @base64' > "${BODY_FILE}.b64"
            base64 -d < "${BODY_FILE}.b64" > "$BODY_FILE"
            node scripts/ai-review-buttons.mjs

            if cmp -s "$BODY_FILE" "$OUT_FILE"; then
              continue
            fi

            # Lost-update guard: skip if the live body moved since the snapshot.
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq '(.body // "") | @base64' > "${BODY_FILE}.now.b64"
            base64 -d < "${BODY_FILE}.now.b64" > "${BODY_FILE}.now"
            if ! cmp -s "$BODY_FILE" "${BODY_FILE}.now"; then
              echo "PR #${number} body changed since snapshot; skipping."
              continue
            fi

            jq -n --rawfile body "$OUT_FILE" '{body: $body}' > "$PATCH_FILE"
            jq -e 'has("body") and (.body | type == "string")' "$PATCH_FILE" > /dev/null
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --input - < "$PATCH_FILE"
            echo "Patched PR #${number}"
          done
