# ERP scale gate (#1302 cutover, tracker #1279). Runs the tests/e2e/scale/erp suite (E1-E3) on every pull request and merge
# queue entry, against this checkout's own packed CLI. Replaces the retired erp-scale-e2e workflow for pull requests (#1302).
# The full 100-service boot (about 107 images, up to 100 minutes) is too heavy to run per pull request, so the gate boots the
# one-stack scope (finance, about 16 services); the full boot runs in e2e-scale-full.yml (manual and weekly).
# The suite declares no secrets (needsSecrets: []), so nothing on a pull request needs a license secret and no step is skipped.
name: ⚖️ E2E | Scale

on:
  # Not on pull requests: the scale gate is the slowest per-PR cost, so it runs on the merge queue and nightly.
  merge_group:

permissions:
  contents: read

concurrency:
  group: e2e-scale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skip the stack on docs-only pull requests (a skipped job satisfies the summary), as e2e-examples and e2e-platforms do.
  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/docs-only # zizmor: ignore[self-repository] composite action resolves from this commit

  e2e-scale:
    name: e2e-scale
    runs-on: ubuntu-26.04
    needs: docs
    if: ${{ !cancelled() && needs.docs.result != 'failure' && needs.docs.outputs.docs_only != 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flisk-sh/tdk-erp-system
          path: erp
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit
      - name: Install Flisk from this checkout
        uses: ./.github/actions/install-flisk # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          version: local

      - name: Machine resources
        run: |
          echo "cpus: $(nproc)"
          free -h
          df -h / | tail -1
          docker version --format 'docker {{.Server.Version}}'

      # One step, so the cases share the project and the timings. SCOPE=one-stack keeps the gate quick; see the header.
      - name: Run the ERP cases (E1-E3, one stack)
        env:
          SCOPE: one-stack
          STACK: finance
          WAIT_MINUTES: "30"
        run: tests/e2e/scale/erp/run.sh E1 E2 E3

      - name: Collect failure evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: e2e-scale

      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: tests/e2e/scale/erp/run.sh diagnostics

      - name: flisk down
        if: always()
        run: tests/e2e/scale/erp/run.sh cleanup
