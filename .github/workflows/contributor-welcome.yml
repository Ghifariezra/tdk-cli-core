name: 👋 Community | Contributor welcome

# Welcomes a first-time contributor when they open their first PR, and explains
# community issues that are closed without a fix. Like contributor-merged.yml, this
# never checks out PR code and only reads event data inside github-script.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] never checks out or runs PR code; only reads event data and posts comments
    types: [opened]
  issues:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions: {}

jobs:
  welcome:
    name: Welcome a first PR
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.type == 'User' &&
      contains(fromJSON('["FIRST_TIME_CONTRIBUTOR","FIRST_TIMER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const body = [
              '<!-- flisk:first-pr -->',
              `Welcome, @${pr.user.login}, and thank you for your first PR! 💜`,
              '',
              'What happens next:',
              '- CI runs automatically. The first run from a new contributor may wait for a maintainer to approve it.',
              '- Every commit needs a `Signed-off-by` line (DCO). If the DCO check fails, run `git rebase --signoff origin/main` and force-push.',
              '- A maintainer will review it. Small follow-ups are normal and not a sign that something is wrong.',
              '',
              `See the [contributing guide](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md) for the checks to run (\`bun run typecheck\`, \`bun run lint\`, \`bun run test\`).`,
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });

  not-fixed:
    name: Explain an issue closed without a fix
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.type == 'User' &&
      github.event.issue.state_reason == 'not_planned' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(fromJSON('["kburym","odykyi"]'), github.event.issue.user.login)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const MARK = '<!-- flisk:closed-not-planned -->';
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: issue.number, per_page: 100 });
            // A maintainer already explained it, or we already posted: stay quiet.
            const explained = comments.some((c) =>
              (c.body && c.body.includes(MARK)) ||
              ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(c.author_association));
            if (explained) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `${MARK}\nThanks @${issue.user.login} for taking the time to report this. We are closing it as not planned for now, because it is outside what Flisk sets out to do or we cannot act on it as written. If you think we got it wrong, comment with more detail and we will happily reopen it.`,
            });
