# Nightly real-apps run (carried over from examples-e2e.yml at the #1302 cutover, so the nightly coverage is not lost).
# Boots the two real example apps (tdk-saas-starter, tdk-restaurant-example)
# on a clean GitHub-hosted runner with the published CLI, then requires their
# actual routes to answer, not only /health: JSON from the business endpoints
# and an HTML page from each frontend. It backs the claim that Flisk runs a real
# app, not just generated health-check stubs.
#
# Manual and daily (04:00 UTC). Separate from the ERP scale test on purpose: different
# size, different timeout, and "healthy" means something else here.
name: 🏗️ E2E | Real example apps (nightly)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to test (latest if empty)"
        type: string
        default: ""
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-real-apps
  cancel-in-progress: false

jobs:
  example:
    name: ${{ matrix.repo }} on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: tdk-saas-starter
            # "pattern|path": the backend whose health URL matches pattern must
            # answer path with 2xx and valid JSON.
            api_checks: |
              dashboard|/api/v1/metrics
              dashboard|/api/v1/activity
              billing|/api/v1/plans
              billing|/api/v1/subscription
            # "pattern|path": the frontend whose URL matches pattern must
            # answer path with 2xx and an HTML document.
            web_checks: |
              dashboard-app|/
              checkout-app|/
          - repo: tdk-restaurant-example
            # Patterns match the service name in the URL (e.g. "reservation"
            # from /api/reservation/health), not the stack name ("guest") --
            # they only happen to be the same word for kitchen.
            api_checks: |
              reservation|/api/v1/reservations
              reservation|/api/v1/waitlist
              kitchen|/api/v1/tickets
              kitchen|/api/v1/stations
              menu|/api/v1/menu-items
            web_checks: |
              reservation-app|/
              floor-app|/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This repository's composite actions, install helper and the real-apps suite (run.sh and lib.sh). The fixture below is
          # checked out into a subdirectory; the local actions resolve from the workspace root, so this checkout has to come first.
          sparse-checkout: |
            .github/actions
            scripts/e2e
            scripts/install-global.mjs
            tests/e2e/lib
            tests/e2e/examples/real-apps
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flisk-sh/${{ matrix.repo }}
          path: example
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      # ubuntu-latest ships a Postgres service on 5432, which collides with the
      # one Flisk generates (see e2e-journeys.yml for the whole story).
      - name: Free port 5432 (runner's preinstalled Postgres)
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      # The four real-apps cases (tests/e2e/examples/real-apps): install the published CLI, set up and doctor the project, install
      # the frontend dependencies, then flisk up and require the real routes. This leg's routes come from the matrix.
      - name: Install Flisk from npm
        env:
          TDK_VERSION: ${{ inputs.version || 'latest' }}
        run: tests/e2e/examples/real-apps/run.sh A1 # zizmor: ignore[adhoc-packages] the point is to test what users install

      - name: Set up the project and check it with flisk doctor
        run: tests/e2e/examples/real-apps/run.sh A2

      - name: Install frontend dependencies for the host typecheck
        run: tests/e2e/examples/real-apps/run.sh A3

      - name: flisk up, then prove the real routes answer
        env:
          API_CHECKS: ${{ matrix.api_checks }}
          WEB_CHECKS: ${{ matrix.web_checks }}
          WAIT_MINUTES: "18"
        run: tests/e2e/examples/real-apps/run.sh A4

      # Failure evidence (#1382): on a failed run, keep the Docker and Tilt logs, service status and generated files for 7 days.
      - name: Collect failure evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: real-apps-${{ matrix.repo }}

      - name: Diagnostics on failure
        if: failure() || cancelled()
        working-directory: example
        run: |
          echo "::group::flisk up log (last 200 lines)"
          tail -200 up.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::containers that are not healthy"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -vE '\((healthy)\)' | head -60 || true
          echo "::endgroup::"
          echo "::group::tilt resources in error"
          tilt get uiresources -o json 2>/dev/null | jq -r '.items[] | select(.status.updateStatus == "error") | "\(.metadata.name): \((.status.buildHistory // [] | map(.error // empty) | first) // "-")"' | head -40 || true
          echo "::endgroup::"

      - name: flisk down
        if: always()
        working-directory: example
        run: flisk down || true
