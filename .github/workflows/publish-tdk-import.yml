name: 📤 Release | Publish tdk-import

# tdk-import lives in flisk-sh/flisk-import but is published with this repo's NPM_TOKEN,
# the only place the secret is set. Run manually with a tag of that repo (for example v0.1.0).
# Leave "dry_run" on first to check what would be published.
#
# Two jobs on purpose: the tag's install and test scripts run in "build", which never sees the
# token. "publish" does not check out or run any tdk-import code; it only publishes the tarball
# "build" produced, so the tag cannot reach NPM_TOKEN (for example through BASH_ENV).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "tdk-import tag to publish (must equal v<version in its package.json>)"
        required: true
        type: string
      dry_run:
        description: "npm publish --dry-run (nothing is published)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Secrets are not readable in a job-level `if`, so the check runs first and its output gates "publish". Without
  # NPM_TOKEN, publish is skipped and this job warns by name; GitHub has no neutral job conclusion, so the skipped
  # job is the neutral result (#1288).
  token:
    name: Check NPM_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - id: check
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning title=NPM_TOKEN not configured::Skipped publishing tdk-import. Add the NPM_TOKEN Actions secret to publish; the build still ran."
            {
              echo "### ⚠️ tdk-import publish skipped"
              echo
              echo "The \`NPM_TOKEN\` Actions secret is not configured, so nothing was published. The build job still ran. Add the secret to publish."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flisk-sh/flisk-import
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Tag matches package.json
        env:
          REF: ${{ inputs.ref }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$REF" != "v$VERSION" ]; then
            echo "::error::Tag $REF does not match package.json version v$VERSION"
            exit 1
          fi

      - run: node -e 'require("child_process").execSync("npm install",{stdio:"inherit"})'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - name: Pack
        env:
          PACK_DIR: ${{ runner.temp }}/pack
        run: |
          mkdir -p "$PACK_DIR"
          npm pack --pack-destination "$PACK_DIR"
          ls -l "$PACK_DIR"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tdk-import-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, token]
    if: needs.token.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned: this job holds the token. Everything it runs comes from these two actions and npm.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tdk-import-tarball

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # No --provenance: the attestation would name this repo's workflow, not tdk-import's source.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: | # zizmor: ignore[use-trusted-publishing] new package: no trusted publisher exists until after the first publish
          TARBALL=$(ls ./*.tgz)
          NAME=$(tar -xOzf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
          VERSION=$(tar -xOzf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, skipping."
            exit 0
          fi
          FLAGS="--access public"
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          # shellcheck disable=SC2086
          npm publish "$TARBALL" $FLAGS
