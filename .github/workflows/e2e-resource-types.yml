# Live-stack resource-type suites (#1290, tracker #1279). The plan job reads each suite's suite.json and builds a matrix of the
# suites that run for the event; each matrix leg boots one suite's stack and runs all of its cases. Replaces agent-e2e.yml.
# On a pull request and nightly a leg tests the packed CLI of the checkout (main, nightly), so a regression on main shows up
# before a release ships it. After a release it tests the published npm package. The gate job always runs and fails when the plan or any selected leg failed.
name: 🧩 E2E | Resource types

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to test (latest or exact version; local checkout is used for pull requests)"
        type: string
        default: ""
      runner:
        description: "Runner label for every job (default ubuntu-latest); try ubuntu-26.04 before ubuntu-latest moves to it (#1277)"
        type: string
        default: "ubuntu-latest"
  # Runs on the merge queue, not on pull requests: the live-stack agent suites are too slow and costly for every PR. The
  # merge queue runs them before a change lands, and the release candidate runs them again. The plan job skips every leg when no
  # changed file is in the list of paths it checks (the PR_PATHS below).
  merge_group:
  schedule:
    - cron: "30 6 * * *"
  # Prove each release right after it is published. Read-only token, no secrets, main branch only; it checks out main itself
  # rather than the triggering run's ref, so nothing untrusted is executed.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["🚀 Release | Binaries and npm package"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# A pull request's newer push supersedes its older run. Every other event queues per trigger and branch, so a manual dispatch
# on one branch never cancels a release, nightly or another branch's run (they used to share one group and cancel each other).
# Release and nightly runs queue and are never cancelled mid-boot.
concurrency:
  group: e2e-resource-types${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || format('-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan the resource-type suites
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - name: Build the matrix for this event
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request | merge_group) trigger="pr" ;;
            schedule) trigger="nightly" ;;
            workflow_run) trigger="release" ;;
            *) trigger="manual" ;;
          esac
          # Pull requests run the backend languages with the most use plus Rust (#1489), Go (#1491) and Node.js (#1490),
          # all proven green on a live stack; nightly, release and manual runs run every language the registry declares. The
          # backend suite's languages run in the "languages" group, one leg per language; the ORM suites run in the "orm" group (#1493).
          # Framework legs (one bun leg per non-default HTTP framework) run with the full set, not on pull requests.
          if [ "$trigger" = "pr" ]; then
            languages="bun,python,rust,go,node"
            frameworks=""
            frontends=""
          else
            languages="$(node tests/e2e/lib/registry-axes.mjs | jq -r '.language | join(",")')"
            frameworks="$(node tests/e2e/lib/registry-axes.mjs | jq -r '.httpFramework | join(",")')"
            frontends="$(node tests/e2e/lib/registry-axes.mjs | jq -r '.frontendFramework | join(",")')"
          fi
          matrix="$(node tests/e2e/lib/suite-matrix.mjs resource-types,orm "$trigger" "$languages" "$frameworks" "$frontends")"
          # A pull request that changes only inside one suite's directory (tests/e2e/<group>/<suite>/) runs only that suite's
          # legs (#1290, #1493). Any other changed file (the CLI, the engine, shared lib, common.sh, this workflow) runs them all.
          if [ "$trigger" = "pr" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            files="$(git diff --name-only "$BASE_SHA" HEAD)"
            # A pull request that touches none of these paths runs no legs, and the gate passes. Keep this list in step with
            # the paths the workflow used to filter on (the gate job must report on every pull request, so it is not in `on:`).
            PR_PATHS='^(cli/src/commands/(agent|restart)\.ts|cli/src/mcp/|cli/src/agent-runtimes/|engine/|\.claude/skills/|scripts/sync-tdk-skills\.sh|tests/e2e/(lib|resource-types|orm)/|\.github/workflows/e2e-resource-types\.yml$)'
            if [ -z "$(printf '%s\n' "$files" | grep -E "$PR_PATHS" || true)" ]; then
              matrix='{"include":[]}'
              files=""
            fi
            outside="$(printf '%s\n' "$files" | grep -v -E '^tests/e2e/(resource-types|orm)/[^/]+/' || true)"
            dirs="$(printf '%s\n' "$files" | sed -n -E 's#^tests/e2e/((resource-types|orm)/[^/]+)/.*#\1#p' | sort -u | paste -sd, -)"
            if [ -z "$outside" ] && [ -n "$dirs" ]; then
              matrix="$(printf '%s' "$matrix" | jq -c --arg dirs ",$dirs," '{include: [.include[] | .dir as $d | select($dirs | contains("," + $d + ","))]}')"
            fi
          fi
          echo "trigger=$trigger"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  resource-types:
    name: ${{ matrix.group }} / ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Choose the version to test
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            version="$(node -p "require('./package.json').version")"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            version="local"
          elif [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          else
            version="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing @flisk-sh/flisk@$version"

      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Flisk
        uses: ./.github/actions/install-flisk # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Tool versions and commit
        env:
          TDK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "tested package: @flisk-sh/flisk@$TDK_VERSION"
          echo "node: $(node --version)"
          echo "docker: $(docker --version)"
          echo "tilt: $(tilt version)"
          echo "flisk: $(flisk --version)"

      # The suite runs every case in order; each case is grouped in the log so a red case is easy to find.
      - name: Run the suite
        env:
          DIR: ${{ matrix.dir }}
          LANGUAGE: ${{ matrix.language }}
          FRAMEWORK: ${{ matrix.framework }}
          BYO_VARIANT: ${{ matrix.variant }}
        run: tests/e2e/"$DIR"/run.sh all

      # Failure evidence (#1382): on a failed run, keep the Docker and Tilt logs, service status and generated files for 7 days.
      - name: Collect failure evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: ${{ matrix.label }}

      - name: Collect diagnostics
        if: failure()
        env:
          DIR: ${{ matrix.dir }}
        run: tests/e2e/"$DIR"/run.sh diagnostics
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-resource-types-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tdk-e2e/${{ matrix.suite }}/artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down
        if: always()
        env:
          DIR: ${{ matrix.dir }}
        run: tests/e2e/"$DIR"/run.sh cleanup

  # Always runs, so the gate reports a result even when no suite is selected. A selected suite that failed or was cancelled
  # fails the gate; a suite that was not selected does not.
  gate:
    name: e2e-resource-types
    needs: [plan, resource-types]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report the result
        env:
          PLAN: ${{ needs.plan.result }}
          LEGS: ${{ needs.resource-types.result }}
        run: |
          echo "plan: $PLAN; resource-type legs: $LEGS"
          if [ "$PLAN" != "success" ]; then echo "::error::The plan job did not succeed"; exit 1; fi
          if [ "$LEGS" = "failure" ] || [ "$LEGS" = "cancelled" ]; then echo "::error::A selected suite failed"; exit 1; fi
