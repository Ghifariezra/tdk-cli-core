# Full 100-service boot (carried over from erp-scale-e2e.yml at the #1302 cutover, so the weekly full boot is not lost).
# Boots the public 100-service fixture bench (flisk-sh/tdk-erp-system), a
# set of generated health-check services rather than a real ERP product, on a
# clean GitHub-hosted runner with the published CLI and waits for every backend
# to answer /health through Traefik. It backs the README's "100 services on a
# 16 GB machine" claim with a measurement anyone can re-run.
#
# Manual and weekly only: a full boot builds ~107 images and takes a long time.
# Use scope "one-stack" for a quick check (about 16 services).
#
# The cases live in tests/e2e/scale/erp (suite.json, run.sh): E1 project and doctor, E2 flisk up and the /health wait, E3 the report.
name: 🏋️ E2E | ERP fixture scale (full, weekly)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "How much of the ERP to boot"
        type: choice
        options: [full, one-stack]
        default: full
      stack:
        description: "Stack to boot when scope is one-stack"
        type: string
        default: finance
      version:
        description: "CLI version to test (latest if empty)"
        type: string
        default: ""
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: e2e-scale-full
  cancel-in-progress: false

jobs:
  erp:
    name: 🏭 ERP boot on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This repository's composite actions, install helper and the e2e suite. The fixture below is checked out into a
          # subdirectory; the local actions resolve from the workspace root, so this checkout has to come first.
          sparse-checkout: |
            .github/actions
            scripts/e2e
            scripts/install-global.mjs
            scripts/wait-for-npm-version.sh
            tests/e2e
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flisk-sh/tdk-erp-system
          path: erp
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Flisk from npm
        uses: ./.github/actions/install-flisk # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          version: ${{ inputs.version || 'latest' }}

      - name: Machine resources
        run: |
          echo "cpus: $(nproc)"
          free -h
          df -h / | tail -1
          docker version --format 'docker {{.Server.Version}}'

      # The three ERP cases (tests/e2e/scale/erp): the project and flisk doctor, flisk up and the wait for every /health, and the report.
      # One step, so the cases share the project and the timings.
      - name: Run the ERP cases (E1-E3)
        env:
          SCOPE: ${{ inputs.scope || 'full' }}
          STACK: ${{ inputs.stack || 'finance' }}
          WAIT_MINUTES: "75"
        run: tests/e2e/scale/erp/run.sh E1 E2 E3



      # Failure evidence (#1382): on a failed run, keep the Docker and Tilt logs, service status and generated files for 7 days.
      - name: Collect failure evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: erp-scale

 

      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: tests/e2e/scale/erp/run.sh diagnostics

      - name: flisk down
        if: always()
        run: tests/e2e/scale/erp/run.sh cleanup
