# The journey suites in tests/e2e/journeys, one matrix leg per suite.json (#1298). A suite runs for the event's trigger (pr,
# nightly, weekly, release, manual). On a pull request a suite runs only when a changed file matches its paths, and the
# licensed cold-start suite never runs on a pull request, because PR code must not be able to read TDK_LICENSE_KEY.
#
# The merge queue runs the same journeys as a pull request (its changed files are the queued commit against the queue base).
# The gate reports on every pull request, so the path filter lives in the selector, not in this workflow's `on:`.
# Each leg reports the check name its old workflow used (suite.json `checkName`), so branch protection keeps working until it
# changes. `gate` is the single job to require once it does: it passes when every selected leg passed or none was selected.
name: 🧭 E2E | Journeys

on:
  merge_group:
  # After a merge, the quickstart leg checks main (the selector picks only the suites with the "main" trigger, and only when a path changed).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to test (local checkout if empty; latest or an exact version also accepted)"
        type: string
        default: ""
  # No paths filter here: the gate must report on every pull request, or the ci.yml summary waits for a check that never comes.
  # scripts/e2e/select-journeys.sh runs a suite only when a changed file matches the suite's own paths, and the gate passes
  # when none was selected.
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly: quickstart
    - cron: "0 7 * * 3" # weekly: cold-start
  # Prove each release boots as soon as it is published. Read-only token, no secrets for the pull request path, main only, and
  # it checks out main itself rather than the triggering run's ref.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["🚀 Release | Binaries and npm package"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# A pull request is cancelled by a newer push; every other trigger queues, so a boot is never cut off mid-way.
concurrency:
  group: e2e-journeys${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Secrets are not readable in a job-level `if`, so the check runs first and its output gates the cold-start suite. The
  # check does not run on a pull request, so no PR code is ever given the secret.
  license:
    name: Check the licensed journey secret
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      TDK_LICENSE_KEY: ${{ secrets.TDK_LICENSE_KEY }}
    steps:
      - id: check
        run: |
          if [ -z "$TDK_LICENSE_KEY" ]; then
            echo "::warning title=TDK_LICENSE_KEY not configured::Skipped the licensed cold-start journey. Add the TDK_LICENSE_KEY Actions secret with a key granting sablier to run it."
            {
              echo "### ⚠️ Licensed cold-start journey skipped"
              echo
              echo "The \`TDK_LICENSE_KEY\` Actions secret is not configured, so the cold-start journey did not run. Add the secret with a key granting \`sablier\` to run it. This is not a failure."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Choose the journeys to run
    needs: license
    if: ${{ always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.select.outputs.run }}
      version: ${{ steps.select.outputs.version }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The changed-file check on a pull request needs the base commit, so fetch the whole history.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          LICENSED: ${{ needs.license.outputs.configured }}
        run: scripts/e2e/select-journeys.sh

  journeys:
    name: ${{ matrix.check || matrix.suite }}
    needs: plan
    # always(): on a pull request the license job is skipped, and a job whose needs chain includes a skipped job is skipped too,
    # so the matrix never expanded there. The plan result and its run list decide instead.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.run != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      # ubuntu-latest ships a Postgres service already listening on 5432, which fails flisk doctor's host-port check.
      - name: Free port 5432 (runner's preinstalled Postgres)
        if: matrix.freePostgres
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Flisk
        if: matrix.install
        uses: ./.github/actions/install-flisk # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          version: ${{ needs.plan.outputs.version }}

      # Smoke and the Go dev loop run from the repository's own CLI build: smoke at the root, the dev loop in cli/.
      - name: Install CLI dependencies (smoke)
        if: matrix.suite == 'smoke'
        run: |
          "$GITHUB_WORKSPACE/scripts/e2e/retry-infra.sh" "bun install" -- bun install --frozen-lockfile

      - name: Install CLI dependencies (dev loop)
        if: matrix.suite == 'dev-loop'
        working-directory: cli
        run: |
          "$GITHUB_WORKSPACE/scripts/e2e/retry-infra.sh" "bun install" -- bun install --frozen-lockfile

      - name: Run the journey (${{ matrix.suite }})
        env:
          SUITE: ${{ matrix.suite }}
          CASES: ${{ matrix.cases }}
          TDK_VERSION: ${{ needs.plan.outputs.version }}
          VERIFY_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke-records
          # Only the cold-start suite may read the licensed secret; the plan never selects it on a pull request.
          TDK_LICENSE_KEY: ${{ matrix.suite == 'cold-start' && secrets.TDK_LICENSE_KEY || '' }}
        # CASES is a space-separated list of case ids, so it word-splits on purpose.
        run: |
          # shellcheck disable=SC2086
          tests/e2e/journeys/"$SUITE"/run.sh $CASES

      # Time to a healthy stack (quickstart): the job summary and this JSON record, kept 30 days.
      - name: Upload time to healthy stack
        if: success() && matrix.suite == 'quickstart'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: time-to-healthy-stack-${{ github.run_id }}
          path: ${{ runner.temp }}/time-to-healthy.json
          if-no-files-found: error
          retention-days: 30

      # Smoke records are kept even when the script fails, so a later regression can be compared with the last success.
      - name: Upload smoke records
        if: always() && matrix.suite == 'smoke'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-records/
          retention-days: 14
          if-no-files-found: error

      # Failure evidence (#1382): on a failed run, keep the Docker and Tilt logs, service status and generated files for 7 days.
      - name: Collect failure evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: ${{ matrix.suite }}

      - name: Diagnostics on failure
        if: failure()
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/e2e/journeys/"$SUITE"/run.sh diagnostics || true

      - name: Tear down the scratch project
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/e2e/journeys/"$SUITE"/run.sh cleanup || true

  # The one check to require once branch protection changes. It passes when every selected journey passed, or none was selected.
  gate:
    name: e2e-journeys
    needs: [plan, journeys]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every selected journey to pass
        env:
          PLAN: ${{ needs.plan.result }}
          JOURNEYS: ${{ needs.journeys.result }}
        run: |
          if [ "$PLAN" != success ] && [ "$PLAN" != skipped ]; then
            echo "Choosing the journeys ended with $PLAN"
            exit 1
          fi
          if [ "$JOURNEYS" != success ] && [ "$JOURNEYS" != skipped ]; then
            echo "A selected journey ended with $JOURNEYS"
            exit 1
          fi
          echo "Every selected journey passed"
