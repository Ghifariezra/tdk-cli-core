# Refreshes docs/journey/map.svg and hacktoberfest.svg from the `island: ...` issue labels every day.
# Also adds the Hacktoberfest map to every open `hacktoberfest` issue (daily, and when the label is applied).
# Run manually from the Actions tab too.
name: 🗺️ Community | Journey map

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  issues:
    types: [labeled] # a new `hacktoberfest` issue gets the Hacktoberfest map straight away

# One run at a time: the map branch is force-pushed.
concurrency:
  group: journey-map
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  map:
    name: 🗺️ Refresh map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Label events run this job only for `hacktoberfest`; no event text is used in any script.
    if: github.event_name != 'issues' || github.event.label.name == 'hacktoberfest'
    permissions:
      contents: write # push the refreshed SVG to the journey-map branch
      issues: write # add the Hacktoberfest map to open `hacktoberfest` issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked] needed to push the journey-map branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node scripts/journey-map.mjs "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Embed the Hacktoberfest map in open hacktoberfest issues
        run: node scripts/hacktoberfest-embed.mjs "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      # `main` is protected (required status checks), and a bot push carries none, so the map is published to
      # its own unprotected `journey-map` branch instead. docs/journey/README.md embeds them from there.
      - name: Publish refreshed maps to the journey-map branch
        run: |
          git fetch origin journey-map || true
          same=true
          for f in map.svg hacktoberfest.svg; do
            git cat-file -e "origin/journey-map:docs/journey/$f" 2>/dev/null \
              && git show "origin/journey-map:docs/journey/$f" | cmp -s - "docs/journey/$f" || same=false
          done
          if $same; then
            echo "Maps unchanged."
          else
            cp docs/journey/map.svg docs/journey/hacktoberfest.svg "$RUNNER_TEMP/"
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            # The branch holds only the SVG (no history of main), so it never goes stale or drifts from main.
            git checkout --orphan journey-map
            git rm -rf -q --cached .
            git clean -fdxq
            mkdir -p docs/journey
            cp "$RUNNER_TEMP/map.svg" "$RUNNER_TEMP/hacktoberfest.svg" docs/journey/
            git add docs/journey/map.svg docs/journey/hacktoberfest.svg
            git commit -m "chore: refresh journey maps"
            git push --force origin journey-map
          fi
