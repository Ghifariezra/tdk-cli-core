# Examples axis group gate (#1302, epic #1279). The default leg runs tests/e2e/examples/default (D1-D4): build and pack the
# candidate CLI, install it, clone and configure the bundled example, boot it and prove the routed worker write path. It runs on
# pull requests and the merge queue, uses no secrets (suite.json needsSecrets is empty) and replaces the retired example-e2e workflow as a
# required check. The job name e2e-examples is the required-check context.
name: 🚪 E2E | Examples gate

on:
  merge_group:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/docs-only # zizmor: ignore[self-repository] composite action resolves from this commit

  e2e-examples:
    name: e2e-examples
    runs-on: ubuntu-26.04
    needs: docs
    # Skip on docs-only pull requests; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.result != 'failure' && needs.docs.outputs.docs_only != 'true' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Free required host ports
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          ports: "80 443 5432"

      # The four default-example cases (tests/e2e/examples/default), run in order.
      - name: Build and pack the candidate Flisk package
        run: tests/e2e/examples/default/run.sh D1

      - name: Pack and install the candidate Flisk package
        run: tests/e2e/examples/default/run.sh D2 # zizmor: ignore[adhoc-packages] installs our own freshly packed tarball

      - name: Clone and configure the bundled example
        run: tests/e2e/examples/default/run.sh D3

      - name: Boot, health check, and prove the routed worker write path
        run: tests/e2e/examples/default/run.sh D4

      # Failure evidence (#1382): on a failed run, keep the Docker and Tilt logs, service status and generated files for 7 days.
      - name: Collect failure evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: example-default

      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: |
          if [ ! -d tdk-example ]; then exit 0; fi
          cd tdk-example
          tail -160 up.log 2>/dev/null || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          docker logs tdk_example_nats 2>&1 | tail -200 || true

      - name: Stop example
        if: always()
        run: |
          if [ -d tdk-example ]; then
            cd tdk-example
            flisk down || true
          fi
